name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e2e-pw

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e-pw/package-lock.json

      - name: Install dependencies
        run: npm ci 

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium # Installs chromium and needed OS libs

      - name: Run Playwright UI tests
        run: npx playwright test login.spec.js
        
      - name: Run Playwright API tests
        run: npx playwright test user-login-api.spec.js 

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/   # ✅ correct path
          retention-days: 30
          if-no-files-found: warn
