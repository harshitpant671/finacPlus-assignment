name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e2e-pw

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e-pw/package-lock.json

      - name: Install dependencies
        run: npm ci 

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium # Installs chromium and needed OS libs

      - name: Run Playwright UI tests
        run: npx playwright test

      - name: Upload Report
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: reports/
          retention-days: 30
